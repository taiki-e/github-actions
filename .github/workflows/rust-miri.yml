# Run `cargo miri test` in strict mode.
#
# There is no stability guarantee for this workflow, since it's supposed to only be
# used in infra managed by us.
#
# Note: We also call this workflow from rust-test.yml.
#
# Usage:
#
# ```yaml
#   miri:
#     uses: taiki-e/github-actions/.github/workflows/rust-miri.yml@main
# ```
#
# See "on.workflow_call.inputs" below for input options.

permissions: {}

on:
  workflow_call:
    inputs:
      rust:
        required: false
        type: string
        default: nightly
      target:
        required: false
        type: string
      args:
        required: false
        type: string
      all-features:
        required: false
        type: boolean
        default: true
      miriflags:
        required: false
        type: string
        default: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-disable-isolation

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

jobs:
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/set-deny-warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: rust@${{ inputs.rust }}+miri
          fallback: none
      - run: printf 'MIRIFLAGS=%s\n' "${INPUT_MIRIFLAGS} -Zmiri-many-seeds=0..16" >>"${GITHUB_ENV}"
        env:
          INPUT_MIRIFLAGS: ${{ inputs.miriflags }}
        if: github.event_name == 'schedule'
      - run: printf 'MIRIFLAGS=%s\n' "${INPUT_MIRIFLAGS}" >>"${GITHUB_ENV}"
        env:
          INPUT_MIRIFLAGS: ${{ inputs.miriflags }}
        if: github.event_name != 'schedule'
      - run: |
          IFS=$'\n\t'
          trap -- 's=$?; printf >&2 "%s\n" "${0##*/}:${LINENO}: \`${BASH_COMMAND}\` exit with ${s}"; exit ${s}' ERR
          args=()
          [[ -z "${INPUT_TARGET}" ]] || args+=(--target "${INPUT_TARGET}")
          if [[ -n "${INPUT_ARGS}" ]]; then
            while IFS= read -rd' '; do
              [[ -z "${REPLY}" ]] || args+=("${REPLY}")
            done <<<"${INPUT_ARGS//[$'\r\n\t']/ } " # Normalize whitespace characters into space.
          fi
          for arg in "${args[@]}"; do
            case "${arg}" in
              --) break ;;
              --features | --features=* | -F | -F?* | --no-default-features | --all-features)
                INPUT_ALL_FEATURES=false
                break
                ;;
            esac
          done
          if [[ "${INPUT_ALL_FEATURES}" == 'true' ]]; then
            args=(--all-features "${args[@]}")
          fi
          (
            set -x
            cargo miri test --workspace "${args[@]}"
          )
        env:
          INPUT_ARGS: ${{ inputs.args }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_ALL_FEATURES: ${{ inputs.all-features }}
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -Z randomize-layout
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Z randomize-layout
